[project]
name = "datacenter-telemetry-control-platform"
version = "0.1.0"
description = "Simulated data-center telemetry lab. Loopback protocols only. Not a customer site."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jatinder Singh" }]
dependencies = [
  "fastapi==0.163.0",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "pydantic==2.14.3",
  "pymodbus==3.16.2",
  "PyYAML==6.0.3",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["mypy==2.4.1", "pytest==9.2.0", "pytest-cov==6.2.1", "ruff==0.17.5"]

[project.scripts]
dc-telemetry = "dc_telemetry.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["dc_telemetry"]

[[tool.mypy.overrides]]
module = ["prometheus_client", "pymodbus", "pymodbus.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=dc_telemetry --cov-report=term-missing --cov-fail-under=90"
